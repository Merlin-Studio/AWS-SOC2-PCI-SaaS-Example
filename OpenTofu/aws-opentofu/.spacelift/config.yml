version: "1"

stack_defaults:
  before_init:
    - echo "Initialising OpenTofu 1.12.0 for AWS landing zone"
    - tofu fmt -check -recursive
  before_plan:
    - echo "Running plan against profile=standard"
  before_apply:
    - echo "Applying — verify no PLACEHOLDER_ tokens remain"
    - "! grep -r 'PLACEHOLDER_' . --include='*.tf' --include='*.tfvars' || (echo 'Refusing to apply — unresolved PLACEHOLDER tokens found' && exit 1)"
  after_plan:
    - echo "Plan complete"
  after_apply:
    - echo "Apply complete; emit run summary"
  environment:
    TF_IN_AUTOMATION: "true"
    TF_INPUT: "false"
    AWS_PAGER: ""

# Run drift detection nightly for prod
drift_detection:
  schedule:
    - "0 3 * * *"
  reconcile: false
  ignore_state: false